<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цветовой круг — подбор сочетаний</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --border: #e3e6eb; --card-bg: #f7f8fa;
    --shadow: 0 4px 18px rgba(0,0,0,.07); --accent: #3b82f6;
  }
  [data-theme="dark"] {
    --bg: #121418; --panel: #1c1f25; --text: #e8eaed; --muted: #98a0ab;
    --border: #2c313a; --card-bg: #23272f;
    --shadow: 0 4px 18px rgba(0,0,0,.45); --accent: #60a5fa;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    transition: background .25s ease, color .25s ease;
  }

  .topbar {
    flex-shrink: 0;
    background: var(--panel); box-shadow: var(--shadow);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 20;
  }
  header {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 18px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0; font-size: 17px; font-weight: 650;
    letter-spacing: .2px; white-space: nowrap;
  }

  .quote-block {
    text-align: center; min-width: 0; padding: 4px 8px;
    border-radius: 8px; transition: background .2s;
  }
  .quote-block.special {
    cursor: pointer; background: rgba(59, 130, 246, .08);
  }
  .quote-block.special:hover { background: rgba(59, 130, 246, .14); }
  .quote-text {
    margin: 0; font-size: 12.5px; line-height: 1.3; font-style: italic;
    color: var(--text);
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .quote-block.special .quote-text {
    color: var(--accent);
    text-decoration: underline dotted;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    font-weight: 600;
  }
  .quote-block.special:hover .quote-text { text-decoration-style: solid; }
  .quote-author {
    margin: 1px 0 0; font-size: 10.5px; font-weight: 600;
    letter-spacing: .4px; color: var(--muted); text-transform: uppercase;
  }
  .quote-block.special .quote-author { color: var(--accent); }

  .header-actions { display: flex; gap: 8px; align-items: center; justify-self: end; }
  .theme-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; font-size: 13px; font-family: inherit; font-weight: 500;
    color: var(--text); background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
    transition: background .2s, border-color .2s, transform .1s;
    white-space: nowrap;
  }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn:active { transform: scale(.97); }

  @media (max-height: 700px) {
    .quote-block { display: none; }
    header { padding: 8px 12px; }
  }
  @media (max-width: 700px) {
    html, body { height: auto; overflow: auto; }
    header {
      grid-template-columns: 1fr auto;
      grid-template-areas: "title actions" "quote quote"; row-gap: 6px;
    }
    header h1 { grid-area: title; }
    .header-actions { grid-area: actions; justify-self: end; }
    .quote-block { grid-area: quote; }
  }

  .tabs { display: flex; gap: 2px; padding: 0 10px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px; background: transparent; border: none;
    border-bottom: 3px solid transparent; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  main {
    flex: 1; min-height: 0; overflow: hidden;
    width: 100%; padding: 10px 10px;
    display: flex; flex-direction: column;
  }
  @media (max-width: 700px) {
    main { overflow: visible; padding: 10px 8px 40px; }
  }

  #tab-picker:not([hidden]),
  #tab-palettes:not([hidden]),
  #tab-light:not([hidden]) {
    display: flex; flex-direction: column;
    gap: 10px; flex: 1; min-height: 0;
  }

  /* Палитры и Свет: скролл по всей секции */
  #tab-palettes:not([hidden]),
  #tab-light:not([hidden]) {
    overflow-y: auto;
    padding-right: 4px;
  }
  #tab-palettes > *,
  #tab-light > * { flex-shrink: 0; }

  @media (max-width: 700px) {
    #tab-picker:not([hidden]),
    #tab-palettes:not([hidden]),
    #tab-light:not([hidden]) {
      flex: none; min-height: auto;
    }
    #tab-palettes:not([hidden]),
    #tab-light:not([hidden]) { overflow: visible; }
    #tab-picker .top-grid {
      flex: none; min-height: auto; overflow: visible;
    }
  }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
    transition: background .25s, border-color .25s;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
  }

  .color-panel { padding: 10px 12px; }
  .color-panel h2 { font-size: 11px; margin: 0 0 6px; }

  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .controls label { font-size: 13px; font-weight: 500; }

  input[type="color"] {
    width: 50px; height: 40px; padding: 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: none; cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }

  #hexInput, #lightBaseHex {
    width: 120px; padding: 9px 11px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 14px; letter-spacing: .5px; color: var(--text);
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; outline: none; transition: border-color .2s;
  }
  #hexInput:focus, #lightBaseHex:focus { border-color: var(--accent); }

  .hint { font-size: 11.5px; color: var(--muted); }

  #tab-picker .controls-panel { flex-shrink: 0; }
  #tab-picker .top-grid { flex: 1; min-height: 0; overflow-y: auto; }
  #tab-picker .history-panel { flex-shrink: 0; }

  .top-grid {
    display: grid;
    grid-template-columns:
      minmax(120px, 0.4fr)
      clamp(200px, 22vh + 30px, 240px)
      minmax(420px, 1.6fr);
    gap: 12px; align-items: start;
  }
  @media (max-width: 900px) { .top-grid { grid-template-columns: 1fr auto; } }
  @media (max-width: 760px) { .top-grid { grid-template-columns: 1fr; } }

  .main-swatch {
    height: clamp(55px, 9vh, 85px);
    border-radius: 8px; border: 1px solid var(--border);
    transition: background .2s;
  }

  .copy-btn {
    display: flex; align-items: baseline; gap: 10px; width: 100%;
    padding: 4px 8px; background: transparent; border: 1px solid transparent;
    border-radius: 6px; font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px; color: var(--text); text-align: left;
    cursor: pointer; transition: background .15s, border-color .15s, transform .08s;
  }
  .copy-btn:hover { background: var(--card-bg); border-color: var(--accent); }
  .copy-btn:active { transform: scale(.98); }
  .copy-btn .k {
    color: var(--muted); font-weight: 700; font-size: 9.5px;
    letter-spacing: .6px; min-width: 28px;
  }

  .codes { margin-top: 4px; display: flex; flex-direction: column; gap: 0; }
  .codes .copy-btn { font-size: 11px; padding: 2px 5px; gap: 6px; }
  .codes .copy-btn .k { font-size: 8.5px; min-width: 22px; letter-spacing: .3px; }

  .wheel-panel { display: flex; flex-direction: column; }
  .wheel-wrap { display: flex; justify-content: center; }
  .wheel {
    position: relative;
    width: clamp(150px, 21vh, 210px);
    height: clamp(150px, 21vh, 210px);
    border-radius: 50%;
    border: 1px solid var(--border);
    background-image:
      radial-gradient(circle closest-side, #ffffff 0%, rgba(255,255,255,0) 72%),
      conic-gradient(from 0deg,
        hsl(0,100%,50%),   hsl(60,100%,50%),  hsl(120,100%,50%),
        hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .dot {
    position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
    pointer-events: none; animation: pop .18s ease-out;
  }
  .dot.main { width: 18px; height: 18px; border-width: 3px; z-index: 2; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }

  .wheel-hint {
    margin: 8px 0 0; text-align: center; font-size: 11px;
    color: var(--muted); line-height: 1.35;
  }

  .random-btn {
    margin-top: 8px; padding: 9px 14px; width: 100%;
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .2px;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .random-btn:hover { opacity: .92; }
  .random-btn:active { transform: scale(.97); }
  .random-btn:disabled { opacity: .55; cursor: wait; }

  .history-grid {
    display: flex; flex-wrap: wrap; gap: 6px;
    min-height: 38px; align-items: center;
  }
  .history-item {
    width: clamp(34px, 4.5vh, 44px);
    height: clamp(34px, 4.5vh, 44px);
    padding: 0; border-radius: 8px;
    border: 2px solid var(--border); cursor: pointer;
    transition: transform .1s, border-color .15s;
    outline: none; box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .history-item:hover { transform: translateY(-1px); border-color: var(--accent); }
  .history-item:active { transform: scale(.96); }
  .history-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .history-item.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .history-empty { font-size: 12px; color: var(--muted); font-style: italic; }

  #schemes {
    display: flex; flex-direction: column; gap: 8px;
    min-height: 0; padding-right: 2px;
  }
  #schemes > .panel {
    padding: 10px 12px; box-shadow: none;
    background: var(--card-bg); flex-shrink: 0;
  }
  #schemes > .panel h2 { font-size: 12px; margin: 0 0 8px; }
  #schemes .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
  }
  #schemes .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    transition: border-color .15s;
  }
  #schemes .card:hover { border-color: var(--accent); }
  #schemes .card .color { height: 56px; }
  #schemes .card .meta { padding: 4px 5px; gap: 2px; display: flex; flex-direction: column; }
  #schemes .card .copy-btn { font-size: 11px; padding: 3px 5px; gap: 5px; }
  #schemes .card .copy-btn .k { font-size: 9px; min-width: 24px; letter-spacing: .3px; }
  #schemes .card .copy-btn span:last-child {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  @media (max-width: 900px) {
    #schemes { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
    #schemes > .panel { flex: 1 1 240px; flex-shrink: 0; }
  }
  @media (max-width: 760px) {
    #schemes { flex-direction: column; }
    #schemes > .panel { flex: auto; }
  }

  .palette-controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: flex-end; padding: 6px 0 12px;
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .count-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
  .count-btn {
    padding: 7px 14px; font: inherit; font-size: 12.5px; font-weight: 500;
    color: var(--text); background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 18px; cursor: pointer;
    transition: background .2s, border-color .2s, color .2s;
  }
  .count-btn:hover { border-color: var(--accent); }
  .count-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .palette-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
    margin-bottom: 12px;
  }
  .palette-card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .palette-colors {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px;
  }
  .color-item { display: flex; flex-direction: column; gap: 3px; }
  .color-block {
    height: 56px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; transition: transform .1s;
  }
  .color-block:hover { transform: translateY(-2px); }
  .color-block:active { transform: scale(.98); }
  .color-item .copy-btn { font-size: 10px; padding: 2px 4px; gap: 4px; border-radius: 5px; }
  .color-item .copy-btn .k { font-size: 8px; min-width: 20px; }
  .color-item .copy-btn span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Мои палитры ---------- */
  .custom-create-row {
    display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; margin-bottom: 14px;
  }
  #newPaletteName {
    flex: 1; min-width: 160px;
    padding: 9px 11px;
    font-family: inherit; font-size: 13px;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color .2s;
  }
  #newPaletteName:focus { border-color: var(--accent); }
  #createPaletteBtn {
    padding: 9px 16px;
    font: inherit; font-size: 13px; font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  #createPaletteBtn:hover { opacity: .92; }
  #createPaletteBtn:active { transform: scale(.97); }

  .custom-empty {
    font-size: 13px; font-style: italic; color: var(--muted);
    text-align: center; padding: 14px 0;
  }

  .palette-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 10px;
  }
  .palette-header h3 { margin: 0; }
  .palette-header h3 .hint { font-size: 11px; margin-left: 4px; }
  .delete-palette-btn {
    width: 26px; height: 26px; padding: 0;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px; line-height: 1;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .delete-palette-btn:hover {
    background: #ef4444; color: #fff; border-color: #ef4444;
  }

  .color-item.custom { position: relative; }
  .remove-color-btn {
    position: absolute;
    top: -4px; right: -4px;
    width: 18px; height: 18px; padding: 0;
    border-radius: 50%;
    background: #ef4444; color: #fff;
    border: 2px solid var(--panel);
    font-size: 11px; line-height: 1; font-weight: 700;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    transition: transform .1s;
    z-index: 2;
  }
  .remove-color-btn:hover { transform: scale(1.15); }

  .add-color-row {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .add-color-picker {
    width: 42px; height: 34px;
  }
  .add-color-hex {
    flex: 1; min-width: 90px;
    padding: 7px 10px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12.5px; letter-spacing: .3px;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px; outline: none;
    transition: border-color .2s;
  }
  .add-color-hex:focus { border-color: var(--accent); }
  .add-color-btn {
    padding: 7px 12px;
    font: inherit; font-size: 12px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px; cursor: pointer;
    transition: opacity .2s, transform .1s;
    white-space: nowrap;
  }
  .add-color-btn:hover { opacity: .92; }
  .add-color-btn:active { transform: scale(.97); }

  .light-base-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .light-base-controls label { font-size: 13px; font-weight: 500; }
  #lightBaseHex { width: 110px; padding: 8px 10px; font-size: 13px; }

  .light-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
  }
  .light-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    transition: border-color .15s;
  }
  .light-card:hover { border-color: var(--accent); }
  .light-name {
    padding: 7px 10px; font-size: 12px; font-weight: 600; color: var(--text);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .light-note {
    font-size: 9px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px;
  }
  .light-preview { display: flex; height: 60px; position: relative; }
  .light-before { width: 38%; position: relative; }
  .light-before::before {
    content: 'до'; position: absolute; left: 4px; top: 4px;
    font-size: 8.5px; color: #fff; background: rgba(0,0,0,.55);
    padding: 1px 4px; border-radius: 2px;
    font-weight: 700; text-transform: uppercase;
  }
  .light-after { flex: 1; position: relative; }
  .light-after::after {
    content: 'после'; position: absolute; right: 4px; top: 4px;
    font-size: 8.5px; color: #fff; background: rgba(0,0,0,.55);
    padding: 1px 4px; border-radius: 2px;
    font-weight: 700; text-transform: uppercase;
  }
  .light-codes { padding: 3px; border-top: 1px solid var(--border); }
  .light-codes .copy-btn { font-size: 10px; padding: 2px 5px; gap: 4px; }
  .light-codes .copy-btn .k { font-size: 8px; min-width: 20px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px);
    padding: 9px 16px; border-radius: 8px; background: #222; color: #fff;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 100; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  #confettiCanvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 500; display: none;
  }
  #confettiCanvas.show { display: block; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <header>
    <h1>Цветовой круг</h1>
    <div class="quote-block" id="quoteBlock">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-author" id="quoteAuthor"></p>
    </div>
    <div class="header-actions">
      <button class="theme-btn" id="themeBtn">Тёмная тема</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="picker">Подбор цвета</button>
    <button class="tab" data-tab="palettes">Готовые палитры</button>
    <button class="tab" data-tab="light">Влияние света</button>
  </nav>
</div>

<main>
  <section id="tab-picker">
    <div class="panel controls controls-panel">
      <label for="picker">Выберите цвет:</label>
      <input type="color" id="picker" value="#3b82f6">
      <input type="text" id="hexInput" value="#3b82f6" spellcheck="false" maxlength="7">
      <span class="hint">HEX — можно ввести вручную</span>
    </div>

    <section class="top-grid">
      <div class="panel color-panel">
        <h2>Заданный цвет</h2>
        <div class="main-swatch" id="mainSwatch"></div>
        <div class="codes" id="mainCodes"></div>
      </div>
      <div class="panel wheel-panel">
        <h2>Круг</h2>
        <div class="wheel-wrap"><div class="wheel" id="wheel"></div></div>
        <p class="wheel-hint">Клик или перетаскивание по кругу —<br>выбрать основной цвет</p>
        <button class="random-btn" id="randomBtn">Случайный цвет</button>
      </div>
      <div id="schemes"></div>
    </section>

    <section class="panel history-panel">
      <h2>История выбора</h2>
      <div class="history-grid" id="historyGrid"></div>
    </section>
  </section>

  <section id="tab-palettes" hidden>
    <div class="palette-controls">
      <div class="count-toggle">
        <button class="count-btn active" data-count="10">10 цветов</button>
        <button class="count-btn" data-count="15">15 цветов</button>
      </div>
    </div>
    <div id="palettesContainer"></div>

    <section class="panel">

/* ============================================================
   Цветовые преобразования
   ============================================================ */
function normalizeHex(hex) {
  let h = String(hex).trim().replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return '#' + h.toLowerCase();
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  const c = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h *= 60;
  }
  return { h, s: s * 100, l: l * 100 };
}
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else              { r = c; b = x; }
  return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
}
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  const v = max;
  const s = max === 0 ? 0 : d / max;
  let h = 0;
  if (d !== 0) {
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)); break;
      case g: h = ((b - r) / d + 2); break;
      case b: h = ((r - g) / d + 4); break;
    }
    h *= 60;
  }
  return { h: Math.round(h), s: Math.round(s * 100), v: Math.round(v * 100) };
}
function formatHsv(rgb) {
  const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
  return `${hsv.h}, ${hsv.s}%, ${hsv.v}%`;
}

let toastTimer = null;

  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);

/* ============================================================

   ============================================================ */
function setRandomQuote() {
  if (!QUOTES.length) return;
  let idx;
  do { idx = Math.floor(Math.random() * QUOTES.length); }
  while (idx === state.lastQuoteIndex && QUOTES.length > 1);
  state.lastQuoteIndex = idx;
  const q = QUOTES[idx];
  quoteText.textContent = '«' + q.text + '»';
  quoteAuthor.textContent = '— ' + q.author;
  quoteBlock.classList.toggle('special', !!q.special);
  quoteBlock.title = q.special ? 'Нажми меня!' : '';
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});
function setTab(name) {
  state.activeTab = name;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  ['picker', 'palettes', 'light'].forEach(tabName => {
    const el = document.getElementById('tab-' + tabName);
    if (tabName === name) el.removeAttribute('hidden');
    else el.setAttribute('hidden', '');
  });
  if (name === 'light') renderLight();
  if (name === 'palettes') { renderPalettes(); renderCustomPalettes(); }
}

/* ============================================================
   История выбора
   ============================================================ */
const HISTORY_MAX = 10;
function saveHistory() {
  try { localStorage.setItem('colorwheel-history', JSON.stringify(colorHistory)); } catch (e) {}
}
function loadHistory() {
  try {
    const raw = localStorage.getItem('colorwheel-history');
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    colorHistory = arr
      .filter(h => typeof h === 'string' && /^#[0-9a-f]{6}$/i.test(h))
      .map(h => h.toLowerCase()).slice(0, HISTORY_MAX);
  } catch (e) {}
}
function commitToHistory(hex) {
  const h = normalizeHex(hex);
  if (!h) return;
  colorHistory = colorHistory.filter(x => x !== h);
  colorHistory.unshift(h);
  if (colorHistory.length > HISTORY_MAX) colorHistory.length = HISTORY_MAX;
  saveHistory();
  renderHistory();
}
function renderHistory() {
  historyGrid.innerHTML = '';
  if (!colorHistory.length) {
    const empty = document.createElement('span');
    empty.className = 'history-empty';
    empty.textContent = 'Пока нет цветов';
    historyGrid.appendChild(empty);
    return;
  }
  colorHistory.forEach(hex => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'history-item';
    btn.style.background = hex;
    btn.dataset.hex = hex;
    btn.title = hex.toUpperCase();
    if (hex === state.hex) btn.classList.add('current');
    btn.addEventListener('click', () => {
      cancelWheelAnimation();
      setColor(hex);
      commitToHistory(hex);
    });
    historyGrid.appendChild(btn);
  });
}
function updateHistoryCurrent() {
  historyGrid.querySelectorAll('.history-item').forEach(item => {
    item.classList.toggle('current', item.dataset.hex === state.hex);
  });
}

/* ============================================================
   Рендер основной вкладки
   ============================================================ */
function render() {
  const rgb = hexToRgb(state.hex);
  const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  const hexUpper = state.hex.toUpperCase();
  const rgbText  = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
  const hsvText  = formatHsv(rgb);

  mainSwatch.style.background = state.hex;
  mainCodes.innerHTML = `
    <button class="copy-btn" data-copy="${hexUpper}" title="Скопировать HEX">
      <span class="k">HEX</span><span>${hexUpper}</span>
    </button>
    <button class="copy-btn" data-copy="${rgbText}" title="Скопировать RGB">
      <span class="k">RGB</span><span>${rgbText}</span>
    </button>
    <button class="copy-btn" data-copy="${hsvText}" title="Скопировать HSV">
      <span class="k">HSV</span><span>${hsvText}</span>
    </button>`;
  mainCodes.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn.dataset.copy, btn.querySelector('.k').textContent));
  });

  const dots = [{ hsl, main: true }];
  SCHEMES.forEach(sc => sc.angles.forEach(a => {
    dots.push({ hsl: { h: (hsl.h + a) % 360, s: hsl.s, l: hsl.l }, main: false });
  }));
  drawWheel(dots);

  schemesEl.innerHTML = '';
  SCHEMES.forEach(sc => {
    const section = document.createElement('section');
    section.className = 'panel';
    const h2 = document.createElement('h2');
    h2.textContent = sc.title;
    section.appendChild(h2);
    const cards = document.createElement('div');
    cards.className = 'cards';
    sc.angles.forEach(angle => {
      const h = (hsl.h + angle) % 360;
      const c = hslToRgb(h, hsl.s, hsl.l);
      const cRgb = { r: Math.round(c.r), g: Math.round(c.g), b: Math.round(c.b) };
      const hex = rgbToHex(cRgb.r, cRgb.g, cRgb.b).toUpperCase();
      const rgbStr = `${cRgb.r}, ${cRgb.g}, ${cRgb.b}`;
      const hsvStr = formatHsv(cRgb);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="color" style="background:${hex}"></div>
        <div class="meta">
          <button class="copy-btn" data-copy="${hex}" title="Скопировать HEX">
            <span class="k">HEX</span><span>${hex}</span>
          </button>
          <button class="copy-btn" data-copy="${rgbStr}" title="Скопировать RGB">
            <span class="k">RGB</span><span>${rgbStr}</span>
          </button>
          <button class="copy-btn" data-copy="${hsvStr}" title="Скопировать HSV">
            <span class="k">HSV</span><span>${hsvStr}</span>
          </button>
        </div>`;
      card.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => copyText(btn.dataset.copy, btn.querySelector('.k').textContent));
      });
      cards.appendChild(card);
    });
    section.appendChild(cards);
    schemesEl.appendChild(section);
  });

  updateHistoryCurrent();
}

function drawWheel(dots) {
  wheel.querySelectorAll('.dot').forEach(d => d.remove());
  const size = wheel.clientWidth || 200;
  const R = size / 2;
  dots.forEach(({ hsl, main }) => {
    const dist = R * (hsl.s / 100) * 0.92;
    const rad = hsl.h * Math.PI / 180;
    const x = Math.sin(rad) * dist;
    const y = -Math.cos(rad) * dist;
    const dot = document.createElement('div');
    dot.className = 'dot' + (main ? ' main' : '');
    dot.style.background = `hsl(${hsl.h} ${hsl.s}% ${hsl.l}%)`;
    dot.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
    wheel.appendChild(dot);
  });
}

/* ============================================================
   Выбор цвета на круге
   ============================================================ */
let isWheelDragging = false;
function pickColorFromWheel(e) {
  const rect = wheel.getBoundingClientRect();
  if (!rect.width) return;
  const cx = rect.width / 2, cy = rect.height / 2, R = rect.width / 2;
  const dx = (e.clientX - rect.left) - cx;
  const dy = (e.clientY - rect.top) - cy;
  const dist = Math.hypot(dx, dy);
  let hue = Math.atan2(dx, -dy) * 180 / Math.PI;
  if (hue < 0) hue += 360;
  const sat = Math.min(100, (dist / (R * 0.92)) * 100);
  const curRgb = hexToRgb(state.hex);
  const curHsl = rgbToHsl(curRgb.r, curRgb.g, curRgb.b);
  let light = curHsl.l;
  if (light <= 5 || light >= 95) light = 50;
  const c = hslToRgb(hue, sat, light);
  setColor(rgbToHex(c.r, c.g, c.b));
}
wheel.addEventListener('pointerdown', e => {
  cancelWheelAnimation();
  e.preventDefault();
  isWheelDragging = true;
  try { wheel.setPointerCapture(e.pointerId); } catch (_) {}
  pickColorFromWheel(e);
});
wheel.addEventListener('pointermove', e => {
  if (!isWheelDragging) return;
  pickColorFromWheel(e);
});
function endWheelDrag(e) {
  const wasDragging = isWheelDragging;
  isWheelDragging = false;
  try { wheel.releasePointerCapture(e.pointerId); } catch (_) {}
  if (wasDragging) commitToHistory(state.hex);
}
wheel.addEventListener('pointerup', endWheelDrag);
wheel.addEventListener('pointercancel', endWheelDrag);

/* ============================================================
   Анимация «Случайный цвет»
   ============================================================ */
let wheelAnimating = false;
let wheelAnimToken = 0;
function cancelWheelAnimation() {
  if (!wheelAnimating) return;
  wheelAnimToken++;
  wheelAnimating = false;
  randomBtn.disabled = false;
  render();
}
function animateToRandomColor() {
  if (wheelAnimating) return;
  const myToken = ++wheelAnimToken;
  wheelAnimating = true;
  randomBtn.disabled = true;
  const duration = 5000;
  const startTime = performance.now();
  const startRgb = hexToRgb(state.hex);
  const startHsl = rgbToHsl(startRgb.r, startRgb.g, startRgb.b);
  const targetHue = Math.random() * 360;
  const targetSat = 40 + Math.random() * 60;
  let targetL = startHsl.l;
  if (targetL < 25) targetL = 25;
  if (targetL > 75) targetL = 75;
  const satFreq = 2 + Math.random() * 2;
  const satAmp = 20;
  let hueDelta = targetHue - startHsl.h;
  hueDelta = ((hueDelta % 360) + 540) % 360 - 180;
  const totalHueDelta = hueDelta + 720;
  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function step(now) {
    if (myToken !== wheelAnimToken) return;
    const t = Math.min(1, (now - startTime) / duration);
    const e = easeInOutCubic(t);
    const h = ((startHsl.h + totalHueDelta * e) % 360 + 360) % 360;
    const baseS = startHsl.s + (targetSat - startHsl.s) * e;
    const wobble = Math.sin(t * Math.PI * 2 * satFreq) * satAmp * (1 - t);
    const s = Math.max(40, Math.min(100, baseS + wobble));
    const l = startHsl.l + (targetL - startHsl.l) * e;
    const rgb = hslToRgb(h, s, l);
    state.hex = rgbToHex(rgb.r, rgb.g, rgb.b);
    picker.value = state.hex;
    hexInput.value = state.hex;
    mainSwatch.style.background = state.hex;
    const dots = [{ hsl: { h, s, l }, main: true }];
    SCHEMES.forEach(sc => sc.angles.forEach(a => {
      dots.push({ hsl: { h: (h + a) % 360, s, l }, main: false });
    }));
    drawWheel(dots);
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      wheelAnimating = false;
      randomBtn.disabled = false;
      setColor(state.hex, true);
      commitToHistory(state.hex);
    }
  }
  requestAnimationFrame(step);
}
randomBtn.addEventListener('click', animateToRandomColor);

/* ============================================================
   Стандартная палитра «Цвета кожи»
   ============================================================ */
function renderPalettes() {
  const colors = state.colorCount === 10
    ? TEN_INDEXES.map(i => SKIN_PALETTE[i])
    : SKIN_PALETTE;
  palettesContainer.innerHTML = '';
  const card = document.createElement('section');
  card.className = 'palette-card';
  card.innerHTML = `<h3>Цвета кожи <span class="hint">· ${colors.length}</span></h3><div class="palette-colors"></div>`;
  const grid = card.querySelector('.palette-colors');
  colors.forEach(hex => {
    const rgb = hexToRgb(hex);
    const rgbStr = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
    const hsvStr = formatHsv(rgb);
    const upperHex = hex.toUpperCase();
    const item = document.createElement('div');
    item.className = 'color-item';
    item.innerHTML = `
      <div class="color-block" style="background:${hex}" title="${upperHex}"></div>
      <button class="copy-btn" data-copy="${upperHex}" title="Скопировать HEX">
        <span class="k">HEX</span><span>${upperHex}</span>
      </button>
      <button class="copy-btn" data-copy="${rgbStr}" title="Скопировать RGB">
        <span class="k">RGB</span><span>${rgbStr}</span>
      </button>
      <button class="copy-btn" data-copy="${hsvStr}" title="Скопировать HSV">
        <span class="k">HSV</span><span>${hsvStr}</span>
      </button>`;
    item.querySelector('.color-block').addEventListener('click', () => copyText(upperHex, 'HEX'));
    item.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => copyText(btn.dataset.copy, btn.querySelector('.k').textContent));
    });
    grid.appendChild(item);
  });
  palettesContainer.appendChild(card);
}
document.querySelectorAll('.count-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.colorCount = parseInt(btn.dataset.count, 10);
    renderPalettes();
  });
});

/* ============================================================
   МОИ ПАЛИТРЫ
   ============================================================ */
const CUSTOM_PALETTES_KEY = 'colorwheel-custom-palettes';

function loadCustomPalettes() {
  try {
    const raw = localStorage.getItem(CUSTOM_PALETTES_KEY);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    customPalettes = arr
      .filter(p => p && typeof p === 'object' && Array.isArray(p.colors))
      .map(p => ({
        id: String(p.id || makeId()),
        name: String(p.name || 'Без названия').slice(0, 40),
        colors: p.colors
          .filter(c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c))
          .map(c => c.toLowerCase())
      }));
  } catch (e) {}
}

function saveCustomPalettes() {
  try { localStorage.setItem(CUSTOM_PALETTES_KEY, JSON.stringify(customPalettes)); } catch (e) {}
}

function makeId() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  return 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}

function createCustomPalette(name, initialColor) {
  const pal = {
    id: makeId(),
    name: (name || 'Без названия').slice(0, 40),
    colors: []
  };
  if (initialColor) {
    const c = normalizeHex(initialColor);
    if (c) pal.colors.push(c);
  }
  customPalettes.unshift(pal);
  saveCustomPalettes();
  renderCustomPalettes();
  return pal;
}

function deleteCustomPalette(id) {
  customPalettes = customPalettes.filter(p => p.id !== id);
  saveCustomPalettes();
  renderCustomPalettes();
}

function addColorToPalette(id, hex) {
  const normalized = normalizeHex(hex);
  if (!normalized) { showToast('Введите корректный HEX'); return false; }
  const pal = customPalettes.find(p => p.id === id);
  if (!pal) return false;
  if (pal.colors.includes(normalized)) {
    showToast('Этот цвет уже в палитре');
    return false;
  }
  if (pal.colors.length >= 40) {
    showToast('Максимум 40 цветов в палитре');
    return false;
  }
  pal.colors.push(normalized);
  saveCustomPalettes();
  renderCustomPalettes();
  return true;
}

function removeColorFromPalette(id, hex) {
  const pal = customPalettes.find(p => p.id === id);
  if (!pal) return;
  pal.colors = pal.colors.filter(c => c !== hex);
  saveCustomPalettes();
  renderCustomPalettes();
}

function renderCustomPalettes() {
  customPalettesList.innerHTML = '';

  if (!customPalettes.length) {
    const empty = document.createElement('div');
    empty.className = 'custom-empty';
    empty.textContent = 'Пока нет своих палитр. Создайте первую!';
    customPalettesList.appendChild(empty);
    return;
  }

  customPalettes.forEach(pal => {
    const card = document.createElement('section');
    card.className = 'palette-card';
    card.dataset.paletteId = pal.id;

    const header = document.createElement('div');
    header.className = 'palette-header';
    header.innerHTML = `
      <h3>${escapeHtml(pal.name)} <span class="hint">· ${pal.colors.length}</span></h3>
      <button class="delete-palette-btn" title="Удалить палитру" data-palette-id="${pal.id}">×</button>`;
    card.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'palette-colors';

    pal.colors.forEach(hex => {
      const rgb = hexToRgb(hex);
      const rgbStr = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
      const hsvStr = formatHsv(rgb);
      const upperHex = hex.toUpperCase();

      const item = document.createElement('div');
      item.className = 'color-item custom';
      item.dataset.paletteId = pal.id;
      item.dataset.hex = hex;
      item.innerHTML = `
        <div class="color-block" style="background:${hex}" title="${upperHex}"></div>
        <button class="remove-color-btn" title="Удалить цвет" data-palette-id="${pal.id}" data-hex="${hex}">×</button>
        <button class="copy-btn" data-copy="${upperHex}" title="Скопировать HEX">
          <span class="k">HEX</span><span>${upperHex}</span>
        </button>
        <button class="copy-btn" data-copy="${rgbStr}" title="Скопировать RGB">
          <span class="k">RGB</span><span>${rgbStr}</span>
        </button>
        <button class="copy-btn" data-copy="${hsvStr}" title="Скопировать HSV">
          <span class="k">HSV</span><span>${hsvStr}</span>
        </button>`;
      grid.appendChild(item);
    });

    card.appendChild(grid);

    // Строка добавления цвета
    const addRow = document.createElement('div');
    addRow.className = 'add-color-row';
    addRow.dataset.paletteId = pal.id;
    const presetHex = pal.colors.length ? pal.colors[pal.colors.length - 1] : state.hex;
    addRow.innerHTML = `
      <input type="color" class="add-color-picker" value="${presetHex}" title="Выбрать цвет">
      <input type="text" class="add-color-hex" placeholder="#HEX или HEX" maxlength="7" value="${presetHex.toUpperCase()}">
      <button class="add-color-btn" data-palette-id="${pal.id}">+ Добавить</button>`;
    card.appendChild(addRow);

    customPalettesList.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* --- Создание палитры --- */
function handleCreatePalette() {
  const name = newPaletteNameInput.value.trim();
  if (!name) { showToast('Введите название палитры'); newPaletteNameInput.focus(); return; }
  createCustomPalette(name, state.hex);
  newPaletteNameInput.value = '';
  showToast('Палитра «' + name + '» создана');
}
createPaletteBtn.addEventListener('click', handleCreatePalette);
newPaletteNameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); handleCreatePalette(); }
});

/* --- Делегирование событий для своих палитр --- */
customPalettesList.addEventListener('click', e => {
  const delPalBtn = e.target.closest('.delete-palette-btn');
  if (delPalBtn) {
    const id = delPalBtn.dataset.paletteId;
    const pal = customPalettes.find(p => p.id === id);
    if (pal && confirm('Удалить палитру «' + pal.name + '»?')) {
      deleteCustomPalette(id);
      showToast('Палитра удалена');
    }
    return;
  }

  const removeBtn = e.target.closest('.remove-color-btn');
  if (removeBtn) {
    removeColorFromPalette(removeBtn.dataset.paletteId, removeBtn.dataset.hex);
    return;
  }

  const addBtn = e.target.closest('.add-color-btn');
  if (addBtn) {
    const row = addBtn.closest('.add-color-row');
    const hexInputEl = row.querySelector('.add-color-hex');
    const pickerEl = row.querySelector('.add-color-picker');
    let v = normalizeHex(hexInputEl.value);
    if (!v) v = pickerEl.value;
    if (addColorToPalette(addBtn.dataset.paletteId, v)) {
      showToast('Цвет добавлен');
    }
    return;
  }

  const copyBtn = e.target.closest('.copy-btn');
  if (copyBtn) {
    copyText(copyBtn.dataset.copy, copyBtn.querySelector('.k').textContent);
    return;
  }

  const colorBlock = e.target.closest('.color-block');
  if (colorBlock) {
    const item = colorBlock.closest('.color-item');
    if (item) copyText(item.dataset.hex.toUpperCase(), 'HEX');
  }
});

customPalettesList.addEventListener('input', e => {
  const hexField = e.target.closest('.add-color-hex');
  if (hexField) {
    const row = hexField.closest('.add-color-row');
    const pickerEl = row.querySelector('.add-color-picker');
    const v = normalizeHex(hexField.value);
    if (v) pickerEl.value = v;
    return;
  }
  const pickerEl = e.target.closest('.add-color-picker');
  if (pickerEl) {
    const row = pickerEl.closest('.add-color-row');
    const hexFieldEl = row.querySelector('.add-color-hex');
    hexFieldEl.value = pickerEl.value.toUpperCase();
  }
});

customPalettesList.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('add-color-hex')) {
    e.preventDefault();
    const row = e.target.closest('.add-color-row');
    const addBtn = row.querySelector('.add-color-btn');
    addBtn.click();
  }
});

/* ============================================================
   Влияние света
   ============================================================ */
function applyLightColor(baseRgb, lightRgb, intensity) {
  const [lr, lg, lb] = lightRgb;
  return {
    r: Math.round(Math.min(255, baseRgb.r * (lr / 255) * intensity)),
    g: Math.round(Math.min(255, baseRgb.g * (lg / 255) * intensity)),
    b: Math.round(Math.min(255, baseRgb.b * (lb / 255) * intensity))
  };
}
function lightCardMarkup(baseHex, lightRgb, intensity, name, note) {
  const baseRgb = hexToRgb(baseHex);
  const resultRgb = applyLightColor(baseRgb, lightRgb, intensity);
  const resultHex = rgbToHex(resultRgb.r, resultRgb.g, resultRgb.b).toUpperCase();
  const resultRgbStr = `${resultRgb.r}, ${resultRgb.g}, ${resultRgb.b}`;
  const resultHsvStr = formatHsv(resultRgb);
  return `
    <div class="light-card">
      <div class="light-name">
        <span>${name}</span>
        ${note ? `<span class="light-note">${note}</span>` : ''}
      </div>
      <div class="light-preview">
        <div class="light-before" style="background:${baseHex}"></div>
        <div class="light-after" style="background:${resultHex}"></div>
      </div>
      <div class="light-codes">
        <button class="copy-btn" data-copy="${resultHex}" title="Скопировать HEX">
          <span class="k">HEX</span><span>${resultHex}</span>
        </button>
        <button class="copy-btn" data-copy="${resultRgbStr}" title="Скопировать RGB">
          <span class="k">RGB</span><span>${resultRgbStr}</span>
        </button>
        <button class="copy-btn" data-copy="${resultHsvStr}" title="Скопировать HSV">
          <span class="k">HSV</span><span>${resultHsvStr}</span>
        </button>
      </div>
    </div>`;
}
function renderLight() {
  lightGrid.innerHTML = LIGHT_PRESETS.map(p =>
    lightCardMarkup(state.hex, p.color, p.intensity, p.name, p.note)
  ).join('');
}
lightGrid.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  copyText(btn.dataset.copy, btn.querySelector('.k').textContent);
});

lightBasePicker.addEventListener('input', e => setColor(e.target.value));
lightBaseHex.addEventListener('input', e => {
  const v = normalizeHex(e.target.value);
  if (v) setColor(v, false);
});
lightBaseHex.addEventListener('blur', e => {
  const v = normalizeHex(e.target.value);
  if (!v) e.target.value = state.hex;
});

/* ============================================================
   Установка цвета / копирование
   ============================================================ */
function setColor(hex, syncInput = true) {
  const normalized = normalizeHex(hex);
  if (!normalized) return;
  state.hex = normalized;
  if (syncInput) {
    hexInput.value = normalized;
    lightBaseHex.value = normalized;
  }
  picker.value = normalized;
  lightBasePicker.value = normalized;
  render();
  renderLight();
}

function copyText(text, label) {
  const okMsg = 'Скопировано ' + (label ? label + ': ' : '') + text;
  const failMsg = 'Не удалось скопировать';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(okMsg)).catch(() => showToast(failMsg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    showToast(ok ? okMsg : failMsg);
  }
}

/* ============================================================
   Тема
   ============================================================ */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  try { localStorage.setItem('colorwheel-theme', theme); } catch (e) {}
}
themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* ============================================================
   Ввод цвета на главной
   ============================================================ */
picker.addEventListener('input', e => { cancelWheelAnimation(); setColor(e.target.value); });
picker.addEventListener('change', e => commitToHistory(e.target.value));
hexInput.addEventListener('input', e => {
  const v = normalizeHex(e.target.value);
  if (v) { cancelWheelAnimation(); setColor(v, false); }
});
hexInput.addEventListener('blur', e => {
  const v = normalizeHex(e.target.value);
  if (v) { setColor(v, true); commitToHistory(v); }
  else  { e.target.value = state.hex; }
});

window.addEventListener('resize', () => render());

/* ============================================================
   КОНФЕТТИ
   ============================================================ */
const confettiCanvas = document.getElementById('confettiCanvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiRunning = false;
const CONFETTI_COLORS = [
  '#f43f5e', '#f97316', '#eab308', '#22c55e', '#3b82f6',
  '#a855f7', '#ec4899', '#06b6d4', '#facc15', '#10b981'
];
function launchConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  confettiCanvas.classList.add('show');
  for (let i = 0; i < 180; i++) {
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 6,
      vy: 2 + Math.random() * 5,
      size: 5 + Math.random() * 9,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rotation: Math.random() * Math.PI * 2,
      rotationSpeed: (Math.random() - 0.5) * 0.25,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      gravity: 0.08 + Math.random() * 0.07,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.02 + Math.random() * 0.05
    });
  }
  if (!confettiRunning) {
    confettiRunning = true;
    requestAnimationFrame(updateConfetti);
  }
}
function updateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let alive = 0;
  for (const p of confettiParticles) {
    p.vy += p.gravity;
    p.sway += p.swaySpeed;
    p.x += p.vx + Math.sin(p.sway) * 1.2;
    p.y += p.vy;
    p.rotation += p.rotationSpeed;
    if (p.y < confettiCanvas.height + 40) alive++;
    const alpha = Math.max(0, Math.min(1, (confettiCanvas.height + 40 - p.y) / 120));
    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rotation);
    confettiCtx.globalAlpha = alpha;
    confettiCtx.fillStyle = p.color;
    if (p.shape === 'rect') {
      confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.6);
    } else {
      confettiCtx.beginPath();
      confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      confettiCtx.fill();
    }
    confettiCtx.restore();
  }
  confettiParticles = confettiParticles.filter(p => p.y < confettiCanvas.height + 40);
  if (alive > 0) {
    requestAnimationFrame(updateConfetti);
  } else {
    confettiRunning = false;
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiCanvas.classList.remove('show');
  }
}
quoteBlock.addEventListener('click', () => {
  if (quoteBlock.classList.contains('special')) launchConfetti();
});

/* ============================================================
   Старт
   ============================================================ */
(function init() {
  let saved = 'light';
  try { saved = localStorage.getItem('colorwheel-theme') || 'light'; } catch (e) {}
  applyTheme(saved);
  loadHistory();
  loadCustomPalettes();
  setRandomQuote();
  setColor('#3b82f6');
  renderPalettes();
  renderCustomPalettes();
  if (!colorHistory.length) commitToHistory(state.hex);
  else renderHistory();
})();
</script>
